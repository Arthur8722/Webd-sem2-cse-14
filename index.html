<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Simple Interest Calculator</h2>

        <input type="number" id="principal" placeholder="Principal Amount"><br><br>

        <input type="number" id="rate" placeholder="Rate of Interest (%)"><br><br>

        <input type="number" id="time" placeholder="Time (Years)"><br><br>

        <button onclick="calculateSI()">Calculate</button>

        <h3 id="result"></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
